name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2019_64
            qt_dir: msvc2019_64
          - os: macos-13
            qt_host: mac
            qt_arch: clang_64
            qt_dir: clang_64
          - os: ubuntu-22.04
            qt_host: linux
            qt_arch: gcc_64
            qt_dir: gcc_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libxi-dev

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 5.15.2 (aqtinstall)
        shell: bash
        run: |
          pip install aqtinstall
          aqt install-qt ${{ matrix.qt_host }} desktop 5.15.2 ${{ matrix.qt_arch }} -O "$GITHUB_WORKSPACE/Qt"

      - name: Configure (CMake + Ninja)
        shell: bash
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/Qt/5.15.2/${{ matrix.qt_dir }}"

      - name: Build
        run: cmake --build build

      - name: Test
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/Qt/5.15.2/${{ matrix.qt_dir }}/bin:$PATH"
          ctest --test-dir build -C Release --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorFlow-${{ matrix.os }}
          path: |
            build/**/CursorFlow.exe
            build/CursorFlow.app
            build/CursorFlow
